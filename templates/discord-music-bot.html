<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANDRZEJ — Discord Music Bot</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --bg2: #0d1420;
            --bg3: #111926;
            --bg4: #162030;
            --cyan: #00f5d4;
            --cyan2: #00c4aa;
            --purple: #b56bff;
            --purple2: #8040cc;
            --pink: #ff4db8;
            --text: #e8f0fe;
            --text2: #7a9bb5;
            --text3: #3d5a7a;
            --border: rgba(0, 245, 212, 0.12);
            --border2: rgba(0, 245, 212, 0.25);
            --glow-cyan: 0 0 20px rgba(0, 245, 212, 0.3), 0 0 40px rgba(0, 245, 212, 0.1);
            --glow-purple: 0 0 20px rgba(181, 107, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated grid bg */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 245, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 245, 212, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* HEADER */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            background: rgba(8, 12, 20, 0.9);
            border-bottom: 1px solid var(--border2);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            color: var(--cyan);
            letter-spacing: 4px;
            text-shadow: var(--glow-cyan);
        }

        .logo span {
            color: var(--purple);
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
        }

        .nav-tab {
            padding: 8px 18px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--text2);
            background: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .nav-tab.active {
            background: var(--bg4);
            color: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.15);
            border: 1px solid var(--border2);
        }

        .nav-tab:hover:not(.active) {
            color: var(--text);
            background: var(--bg2);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* MAIN LAYOUT */
        main {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 340px 1fr 300px;
            gap: 0;
            height: calc(100vh - 65px);
        }

        /* PANELS */
        .panel {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .panel:last-child {
            border-right: none;
        }

        .panel::-webkit-scrollbar {
            width: 3px;
        }

        .panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 99px;
        }

        .panel-header {
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
        }

        .panel-title {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* SEARCH */
        .search-wrap {
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 9px 14px 9px 36px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-wrap input:focus {
            border-color: var(--cyan2);
        }

        .search-wrap input::placeholder {
            color: var(--text3);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text3);
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* SONG LIST */
        .song-list {
            padding: 8px 0;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }

        .song-item:hover {
            background: rgba(0, 245, 212, 0.04);
            border-left-color: var(--cyan2);
        }

        .song-item.playing {
            background: rgba(0, 245, 212, 0.07);
            border-left-color: var(--cyan);
        }

        .song-num {
            font-size: 10px;
            color: var(--text3);
            min-width: 20px;
            text-align: right;
        }

        .song-item.playing .song-num {
            display: none;
        }

        .playing-bars {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            min-width: 20px;
            justify-content: flex-end;
        }

        .song-item.playing .playing-bars {
            display: flex;
        }

        .bar {
            width: 3px;
            background: var(--cyan);
            border-radius: 99px;
            animation: bar 0.8s ease-in-out infinite;
        }

        .bar:nth-child(1) {
            height: 6px;
            animation-delay: 0s;
        }

        .bar:nth-child(2) {
            height: 12px;
            animation-delay: 0.15s;
        }

        .bar:nth-child(3) {
            height: 8px;
            animation-delay: 0.3s;
        }

        @keyframes bar {

            0%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.3);
            }
        }

        .song-thumb {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            background: var(--bg3);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .song-item.playing .song-title {
            color: var(--cyan);
        }

        .song-meta {
            font-size: 10px;
            color: var(--text3);
            letter-spacing: 0.5px;
        }

        .song-counter {
            font-size: 10px;
            color: var(--purple);
            background: rgba(181, 107, 255, 0.1);
            border: 1px solid rgba(181, 107, 255, 0.2);
            border-radius: 4px;
            padding: 2px 7px;
            white-space: nowrap;
        }

        .song-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .song-item:hover .song-actions {
            opacity: 1;
        }

        .icon-btn {
            width: 28px;
            height: 28px;
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text2);
            font-size: 12px;
        }

        .icon-btn:hover {
            background: var(--bg3);
            color: var(--cyan);
            border-color: var(--border2);
        }

        .icon-btn svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* CENTER PANEL */
        .center-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* NOW PLAYING */
        .now-playing {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(0, 245, 212, 0.04) 0%, transparent 100%);
        }

        .np-label {
            font-family: 'Orbitron', monospace;
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .np-main {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .np-artwork {
            width: 72px;
            height: 72px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--bg3), var(--bg4));
            border: 1px solid var(--border2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            box-shadow: var(--glow-cyan);
            animation: rotate-glow 4s linear infinite;
        }

        @keyframes rotate-glow {

            0%,
            100% {
                box-shadow: 0 0 16px rgba(0, 245, 212, 0.2);
            }

            50% {
                box-shadow: 0 0 30px rgba(0, 245, 212, 0.4), 0 0 60px rgba(181, 107, 255, 0.15);
            }
        }

        .np-details {
            flex: 1;
            min-width: 0;
        }

        .np-title {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .np-sub {
            font-size: 11px;
            color: var(--text2);
            letter-spacing: 1px;
        }

        /* PROGRESS BAR */
        .progress-area {
            margin-bottom: 16px;
        }

        .progress-track {
            height: 4px;
            background: var(--bg4);
            border-radius: 99px;
            cursor: pointer;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan2), var(--cyan));
            border-radius: 99px;
            width: 35%;
            position: relative;
            transition: width 0.5s linear;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }

        .progress-times {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text3);
        }

        /* CONTROLS */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg3);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text2);
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            color: var(--cyan);
            border-color: var(--border2);
            background: var(--bg4);
        }

        .ctrl-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .ctrl-btn.active {
            color: var(--cyan);
            border-color: var(--border2);
        }

        .play-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--cyan);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--bg);
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.4);
            transition: all 0.2s;
        }

        .play-btn:hover {
            background: #00ddc0;
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.6);
            transform: scale(1.05);
        }

        .play-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .vol-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
        }

        .vol-label {
            font-size: 10px;
            color: var(--text3);
        }

        .vol-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: var(--bg4);
            border-radius: 99px;
            outline: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cyan);
            cursor: pointer;
            box-shadow: 0 0 6px var(--cyan);
        }

        /* QUEUE */
        .queue-section {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .queue-section::-webkit-scrollbar {
            width: 3px;
        }

        .queue-section::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 99px;
        }

        .queue-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 5;
        }

        .queue-title {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--purple);
            text-transform: uppercase;
        }

        .queue-count {
            font-size: 10px;
            color: var(--text3);
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px 10px 28px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s, opacity 0.15s;
            cursor: grab;
            user-select: none;
        }

        .queue-item:active {
            cursor: grabbing;
        }

        .queue-item:hover {
            background: rgba(181, 107, 255, 0.04);
        }

        .queue-item.dragging {
            opacity: 0.3;
            background: rgba(181, 107, 255, 0.08);
        }

        .queue-item.drag-over-top {
            border-top: 2px solid var(--cyan);
            background: rgba(0, 245, 212, 0.05);
        }

        .queue-item.drag-over-bottom {
            border-bottom: 2px solid var(--cyan);
            background: rgba(0, 245, 212, 0.05);
        }

        .drag-handle {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 4px 0;
            opacity: 0;
            transition: opacity 0.15s;
            flex-shrink: 0;
            cursor: grab;
        }

        .drag-handle span {
            display: block;
            width: 14px;
            height: 2px;
            background: var(--text3);
            border-radius: 99px;
            transition: background 0.15s;
        }

        .queue-item:hover .drag-handle {
            opacity: 1;
        }

        .queue-item:hover .drag-handle span {
            background: var(--cyan2);
        }

        .queue-pos {
            font-size: 11px;
            color: var(--text3);
            min-width: 20px;
            text-align: center;
        }

        .queue-thumb {
            width: 34px;
            height: 34px;
            border-radius: 4px;
            background: var(--bg3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .queue-info {
            flex: 1;
            min-width: 0;
        }

        .queue-song-title {
            font-size: 11px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .queue-song-meta {
            font-size: 10px;
            color: var(--text3);
        }

        .remove-btn {
            opacity: 0;
            transition: opacity 0.15s;
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            line-height: 1;
        }

        .queue-item:hover .remove-btn {
            opacity: 1;
        }

        .remove-btn:hover {
            color: var(--pink);
        }

        /* RIGHT PANEL — STATS + PLAYLISTS */
        .right-panel {
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .playlists-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        /* STATS */
        .stats-section {
            padding: 16px 0 0;
        }

        .top-song-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            transition: background 0.15s;
        }

        .top-song-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .top-rank {
            font-family: 'Orbitron', monospace;
            font-size: 12px;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        .rank-1 {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .rank-2 {
            color: #c0c0c0;
        }

        .rank-3 {
            color: #cd7f32;
        }

        .rank-other {
            color: var(--text3);
        }

        .top-info {
            flex: 1;
            min-width: 0;
        }

        .top-title {
            font-size: 11px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .top-bar-wrap {
            height: 3px;
            background: var(--bg4);
            border-radius: 99px;
            overflow: hidden;
        }

        .top-bar-fill {
            height: 100%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--purple2), var(--purple));
        }

        .top-plays {
            font-size: 10px;
            color: var(--purple);
            white-space: nowrap;
        }

        /* PLAYLISTS */
        .playlists-section {
            padding: 0;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .playlists-section::-webkit-scrollbar {
            width: 3px;
        }

        .playlists-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlists-section::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 99px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }

        .playlist-item:hover {
            background: rgba(181, 107, 255, 0.04);
            border-left-color: var(--purple2);
        }

        .playlist-item.active {
            border-left-color: var(--purple);
            background: rgba(181, 107, 255, 0.07);
        }

        .playlist-icon {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: linear-gradient(135deg, rgba(181, 107, 255, 0.2), rgba(181, 107, 255, 0.05));
            border: 1px solid rgba(181, 107, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .playlist-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-name {
            font-size: 12px;
            color: var(--text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-count {
            font-size: 10px;
            color: var(--text3);
        }

        .playlist-menu {
            opacity: 0;
            transition: opacity 0.15s;
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .playlist-item:hover .playlist-menu {
            opacity: 1;
        }

        /* CREATE PLAYLIST BTN */
        .create-playlist-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            cursor: pointer;
            color: var(--purple);
            font-size: 12px;
            background: none;
            border: none;
            border-top: 1px solid var(--border);
            width: 100%;
            font-family: 'Space Mono', monospace;
            transition: background 0.15s;
        }

        .create-playlist-btn:hover {
            background: rgba(181, 107, 255, 0.04);
        }

        .plus-circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px dashed rgba(181, 107, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--purple);
            line-height: 1;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 28px;
            width: 420px;
            max-width: 95vw;

        .modal-title {

        .modal-input {

        .btn-cancel {

            font-size: 11px;

            transition: all 0.15s;

        .btn-cancel:hover {
            border-color: var(--border2);

        .btn-confirm {

            border-radius: 6px;

            font-size: 11px;
            font-weight: 700;

            font-size: 11px;
            cursor: pointer;

            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .yt-input-row {

            gap: 6px;
        }

        .yt-input {

        .yt-input:focus {
            border-color: rgba(255, 68, 68, 0.5);

        .live-dot {

        .feed-clear-btn {
            background: none;
            border: none;
            color: var(--text3);
            font-size: 10px;
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
            transition: color 0.15s;
        }

        .feed-clear-btn:hover {
            color: var(--text2);
        }

        .bot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;

        }

        .bot-messages::-webkit-scrollbar {

        @keyframes fade-up {

                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-msg-time {
            font-size: 9px;
            color: var(--text3);

        .author-bot {

        .author-user {

        }

        .author-system {
            color: #ff4444;

        .bot-msg-text {
            font-size: 11px;
            color: var(--text2);

        .bot-msg-text .song-link {
            color: var(--cyan);

        .msg-input-row {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .msg-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 9px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--text);
            outline: none;
        }

        .msg-input::placeholder {
            color: var(--text3);
        }

        .msg-send-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            border-left: 1px solid var(--border);
            color: var(--purple);
            cursor: pointer;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

        .msg-send-btn:hover {
            background: rgba(181, 107, 255, 0.08);
            color: var(--purple);
        }
    </style>
</head>

<body>

    <div id="loginScreen"
        style="display:none; position:fixed; inset:0; background:var(--bg); z-index:999; align-items:center; justify-content:center; flex-direction:column; gap:20px;">
        <div class="logo">ANDRZ<span>EJ</span></div>
        <p style="color:var(--text2); font-size:12px; letter-spacing:2px;">MEMBERS ONLY</p>
        <button onclick="login()"
            style="padding:12px 28px; background:var(--cyan); border:none; border-radius:8px; font-family:'Space Mono',monospace; font-weight:700; cursor:pointer; color:var(--bg); letter-spacing:2px; box-shadow:var(--glow-cyan);">
            LOGIN WITH DISCORD
        </button>
    </div>

    <div id="app" style="display:none;">

        <header>
            <div class="logo">ANDRZ<span>EJ</span></div>
            <nav class="nav-tabs">
                <button class="nav-tab active" onclick="setPage('player')">Player</button>
                <button class="nav-tab" onclick="setPage('library')">Library</button>
                <button class="nav-tab" onclick="setPage('playlists')">Playlists</button>
                <button class="nav-tab" onclick="setPage('stats')">Stats</button>
            </nav>
            <div style="display:flex; align-items:center; gap:12px;">
                <button onclick="logout()"
                    style="font-family:'Space Mono',monospace; font-size:11px; background:none; border:1px solid var(--border); border-radius:6px; padding:6px 14px; color:var(--text2); cursor:pointer; letter-spacing:1px;">LOGOUT</button>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    BOT ONLINE
                </div>
            </div>
        </header>

        <main>
            <!-- LEFT: Song Library -->
            <div class="panel" id="leftPanel">
                <!-- YouTube Search -->
                <div class="yt-search-area">
                    <div class="yt-label"><span class="yt-icon"></span>YouTube Search</div>
                    <div class="yt-input-row">
                        <input type="text" class="yt-input" id="ytInput" placeholder="Search YouTube for a song..."
                            onkeydown="if(event.key==='Enter') ytSearch()">
                        <button class="yt-search-btn" id="ytSearchBtn" onclick="ytSearch()">SEARCH</button>
                    </div>
                    <div class="yt-results" id="ytResults"></div>
                </div>

                <div class="panel-header">
                    <div class="panel-title">Song Cache</div>
                    <div class="search-wrap">
                        <svg class="search-icon" viewBox="0 0 16 16">
                            <circle cx="6" cy="6" r="4" />
                            <path d="m10 10 4 4" stroke-linecap="round" />
                        </svg>
                        <input type="text" placeholder="Search songs..." id="songSearch" oninput="filterSongs()">
                    </div>
                </div>

                <div class="song-list" id="songListEl"></div>
            </div>

            <!-- CENTER: Now Playing + Queue -->
            <div class="center-panel panel">
                <!-- Now Playing -->
                <div class="now-playing">
                    <div class="np-label">Now Playing</div>
                    <div class="np-main">
                        <div class="np-artwork" id="npArtwork">🎵</div>
                        <div class="np-details">
                            <div class="np-title" id="npTitle">Select a track</div>
                            <div class="np-sub" id="npSub">—</div>
                        </div>
                    </div>

                    <div class="progress-area">
                        <div class="progress-track" onclick="seekTrack(event)">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-times">
                            <span id="timeElapsed">0:00</span>
                            <span id="timeTotal">—</span>
                        </div>
                    </div>

                    <div class="controls">
                        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle" onclick="toggleShuffle()">
                            <svg viewBox="0 0 24 24">
                                <path d="M16 3h5v5M4 20l5.5-5.5M21 3l-7.5 7.5M4 4l5.5 5.5M16 21h5v-5M15 15l6 6"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
                            </svg>
                        </button>
                        <button class="ctrl-btn" onclick="prevSong()" title="Previous">
                            <svg viewBox="0 0 24 24">
                                <path d="M19 20 9 12l10-8v16zM5 4v16" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" fill="none" />
                            </svg>
                        </button>
                        <button class="play-btn" id="playBtn" onclick="togglePlay()">
                            <svg id="playIcon" viewBox="0 0 24 24">
                                <path d="M5 3l14 9-14 9V3z" />
                            </svg>
                        </button>
                        <button class="ctrl-btn" onclick="nextSong()" title="Next">
                            <svg viewBox="0 0 24 24">
                                <path d="M5 4l10 8-10 8V4zM19 4v16" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" fill="none" />
                            </svg>
                        </button>
                        <button class="ctrl-btn" id="loopBtn" title="Loop" onclick="toggleLoop()">
                            <svg viewBox="0 0 24 24">
                                <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
                            </svg>
                        </button>
                    </div>

                    <div class="vol-area">
                        <span class="vol-label">VOL</span>
                        <input type="range" class="vol-slider" min="0" max="100" value="70" id="volSlider"
                            oninput="updateVol(this.value)">
                        <span class="vol-label" id="volVal">70%</span>
                    </div>
                </div>

                <!-- Queue -->
                <div class="queue-section">
                    <div class="queue-header">
                        <span class="queue-title">Queue <span class="tab-badge" id="queueBadge">0</span></span>
                        <button class="icon-btn" onclick="clearQueue()" title="Clear queue">
                            <svg viewBox="0 0 24 24">
                                <polyline points="3 6 5 6 21 6" />
                                <path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                    <div id="queueList"></div>
                </div>
            </div>

            <!-- RIGHT: Stats + Playlists -->
            <div class="panel right-panel">
                <!-- Top 10 Stats -->
                <div class="panel-header">
                    <div class="panel-title">Top 10 Tracks</div>
                </div>
                <div class="stats-section" id="topSongsList"></div>

                <!-- Playlists -->
                <div class="playlists-wrapper">
                    <div class="section-divider">Playlists</div>
                    <div class="playlists-section" id="playlistsList"></div>
                    <button class="create-playlist-btn" onclick="openCreatePlaylist()">
                        <span class="plus-circle">+</span>
                        New Playlist
                    </button>
                </div>

                <!-- Bot Message Feed -->
                <div class="bot-feed">
                    <div class="bot-feed-header">
                        <span class="bot-feed-title"><span class="live-dot"></span>Bot Messages</span>
                        <button class="feed-clear-btn" onclick="clearFeed()">CLEAR</button>
                    </div>
                    <div class="bot-messages" id="botMessages"></div>
                    <div class="msg-input-row">
                        <input type="text" class="msg-input" id="msgInput" placeholder="Send a command to bot..."
                            onkeydown="if(event.key==='Enter') sendMsg()">
                        <button class="msg-send-btn" onclick="sendMsg()">SEND</button>
                    </div>
                </div>
            </div>
        </main>
    </div><!-- /#app -->

    <!-- CREATE PLAYLIST MODAL -->
    <div class="modal-overlay" id="createPlaylistModal">
        <div class="modal">
            <div class="modal-title">NEW PLAYLIST</div>
            <div class="modal-label">Playlist Name</div>
            <input type="text" class="modal-input" id="newPlaylistName" placeholder="e.g. Late Night Vibes">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('createPlaylistModal')">Cancel</button>
                <button class="btn-confirm" onclick="createPlaylist()">Create</button>
            </div>
        </div>
    </div>

    <!-- EDIT PLAYLIST MODAL -->
    <div class="modal-overlay" id="editPlaylistModal">
        <div class="modal">
            <div class="modal-title" id="editPlaylistTitle">EDIT PLAYLIST</div>
            <div class="modal-label">Rename</div>
            <input type="text" class="modal-input" id="editPlaylistName" placeholder="Playlist name">
            <div class="modal-label">Tracks</div>
            <div id="editPlaylistTracks" style="max-height: 200px; overflow-y: auto; margin-bottom: 16px;"></div>
            <div class="modal-actions">
                <button class="btn-danger" onclick="deletePlaylist()">Delete</button>
                <button class="btn-cancel" onclick="closeModal('editPlaylistModal')">Cancel</button>
                <button class="btn-confirm" onclick="savePlaylist()">Save</button>
            </div>
        </div>
    </div>

    <!-- ADD TO PLAYLIST MODAL -->
    <div class="modal-overlay" id="addToPlaylistModal">
        <div class="modal">
            <div class="modal-title">ADD TO PLAYLIST</div>
            <div id="addToPlaylistSongName" style="font-size:12px; color:var(--text2); margin-bottom:16px;"></div>
            <div id="addToPlaylistList"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('addToPlaylistModal')">Close</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ─── MOCK DATA (replace with real API calls to your SQLite backend) ───
        const emojis = ['🎸', '🎹', '🎺', '🎷', '🎻', '🥁', '🎤', '🎧', '🎵', '🎶', '🎼', '🔥', '💫', '⚡', '🌊'];

        const API = '';

        // check if already authenticated on page load
        async function checkAuth() {
            try {
                const res = await fetch(`${API}/api/songs`, {credentials: 'include'});
                if (res.status === 401) {showLoginScreen(); return;}
                if (res.status === 403) {
                    document.getElementById('loginScreen').innerHTML = `

        // ─── RENDER QUEUE (with drag-and-drop) ───
        let dragSrcIdx = null;

        async function renderQueue() {
            const res = await apiFetch(`/api/queue`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            queue = data.queue;

            const el = document.getElementById('queueList');

            if (!queue.length) {
                el.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Queue is empty<br>Add songs from the library</div>`;
                return;
            }

            el.innerHTML = queue.map((id, i) => {
                const s = getSong(id);
                return `<div class="queue-item"
        draggable="true"
        data-idx="${i}"
        ondragstart="onDragStart(event, ${i})"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDrop(event, ${i})"
        ondragend="onDragEnd(event)">
      <div class="drag-handle"><span></span><span></span><span></span></div>
      <span class="queue-pos">${i + 1}</span>
      <div class="queue-thumb">${getEmoji(id)}</div>
      <div class="queue-info">

    </div>`;
            }).join('');

        function onDragStart(e, idx) {
            dragSrcIdx = idx;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', idx);
            // slight delay so the element renders before going semi-transparent
            requestAnimationFrame(() => e.target.classList.add('dragging'));
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const item = e.currentTarget;
            clearDragStyles();
            const rect = item.getBoundingClientRect();
            const midY = rect.top + rect.height / 2;
            if (e.clientY < midY) {
                item.classList.add('drag-over-top');
            } else {
                item.classList.add('drag-over-bottom');
            }
        }

        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
        }

        function onDrop(e, targetIdx) {
            e.preventDefault();
            clearDragStyles();
            if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;

            const item = e.currentTarget;
            const rect = item.getBoundingClientRect();
            const insertAfter = e.clientY >= rect.top + rect.height / 2;
            let insertAt = insertAfter ? targetIdx + 1 : targetIdx;

            // Remove from old position
            const [moved] = queue.splice(dragSrcIdx, 1);
            // Adjust insert index if we removed before it
            if (dragSrcIdx < insertAt) insertAt--;
            queue.splice(insertAt, 0, moved);

            dragSrcIdx = null;
            renderQueue();
            pushMsg('ANDRZEJ', `Queue reordered — "${getSong(moved).title}" moved to position ${insertAt + 1}`, 'bot');
        }

        function onDragEnd(e) {
            clearDragStyles();
            dragSrcIdx = null;
        }

        function clearDragStyles() {
            document.querySelectorAll('.queue-item').forEach(el => {
                el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom');
            });
        }

        async function playSong(id) {
            if (currentSongId === id) {togglePlay(); return;}
            currentSongId = id;
            progress = 0;
            isPlaying = true;
            try {
                const res2 = await fetch(`${API}/api/playThis`, {

            updateNowPlaying();

        function prevSong() {
            const idx = songs.findIndex(s => s.id === currentSongId);
            const newIdx = (idx - 1 + songs.length) % songs.length;
            playSong(songs[newIdx].id);
        }

        function nextSong() {
            if (queue.length) {playSong(queue.shift()); renderQueue(); return;}
            const idx = songs.findIndex(s => s.id === currentSongId);
            const newIdx = isShuffle
                ? Math.floor(Math.random() * songs.length)
                : (idx + 1) % songs.length;
            playSong(songs[newIdx].id);

        function seekTrack(e) {
            const rect = e.currentTarget.getBoundingClientRect();

            updateProgress();
        }

        function startProgress() {
            stopProgress();
            progressInterval = setInterval(() => {
                const dur = getDuration(currentSongId);
                progress += 100 / (dur * 10);
                if (progress >= 100) {
                    progress = 0;
                    if (isLoop) return;
                    nextSong();
                }
                updateProgress();
            }, 100);
        }

        function stopProgress() {
            clearInterval(progressInterval);

        function updateProgress() {
            document.getElementById('progressFill').style.width = Math.min(progress, 100) + '%';

        function sendMsg() {

            pushMsg('You', raw, 'user');

            setTimeout(() => {
                const parts = raw.split(' ');
                const cmd = parts[0].toLowerCase();
                const arg = parts.slice(1).join(' ');
                const handler = botResponses[cmd];
                if (handler) {
                    pushMsg('ANDRZEJ', handler(arg), 'bot');
                } else if (raw.startsWith('!')) {
                    pushMsg('ANDRZEJ', `Unknown command "${cmd}". Type !help for commands.`, 'bot');
                } else {
                    pushMsg('ANDRZEJ', `I only respond to commands starting with ! — try !help`, 'bot');

            }, 400 + Math.random() * 300);

            {title: 'Martin Garrix - Animals (Official Video)', channel: 'Martin Garrix', duration: '5:02', views: '640M'},

        const emojisThumbs = ['🎸', '🎹', '🎺', '🎷', '🎻'];

        async function ytSearch() {
            const q = document.getElementById('ytInput').value.trim();
            if (!q) return;

            const btn = document.getElementById('ytSearchBtn');
            const results = document.getElementById('ytResults');
            btn.disabled = true;
            results.innerHTML = `<div class="yt-searching"><div class="spinner"></div>Searching YouTube...</div>`;
            pushMsg('You', `Searching YouTube for: "${q}"`, 'user');

            try {
                const res = await apiFetch(`/api/searchYT?query=${encodeURIComponent(q)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                console.log(data);

                // data is a single object from your Go endpoint right now
                // when you wire up real YT API it'll be an array — adjust accordingly
                const resultItems = Array.isArray(data) ? data : [data];
                ytsearchResult = resultItems;
                results.innerHTML = resultItems.map((r, i) => `
            <div class="yt-result-item">
                <div class="yt-thumb">${emojisThumbs[i % emojisThumbs.length]}</div>
                <div class="yt-result-info">
                    <div class="yt-result-title" title="${r.title}">${r.title}</div>
                    <div class="yt-result-meta">${r.channel} · ${r.duration}</div>
                </div>
                <div class="yt-result-actions">
                    <button class="icon-btn" onclick="ytPlay(${i}, '${r.title.replace(/'/g, "\\'")}', '${r.duration}')" title="Play now">
                        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="currentColor"/></svg>
                    </button>
                    <button class="icon-btn" onclick="ytQueue(${i}, '${r.title.replace(/'/g, "\\'")}', '${r.duration}')" title="Add to queue">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
            </div>
        `).join('');

                pushMsg('SOUNDWAVE', `Found ${resultItems.length} results for "${q}"`, 'bot');
            } catch (err) {
                results.innerHTML = `<div class="empty-state">No results found</div>`;
                pushMsg('SYSTEM', `Search failed: ${err.message}`, 'system');
            } finally {
                btn.disabled = false;
            }
        }

        async function ytPlay(idx, title, duration) {
            // In real implementation: send play command to bot via your API/WebSocket
            // The bot would then join voice and stream from YouTube

            try {
                const res = await apiFetch(`/api/downloadYT?query=${encodeURIComponent(ytsearchResult[idx].filename)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const newId = 'yt_' + Date.now();
                songs.push({id: newId, title, server: 'youtube', played_counter: 0, filename: ytsearchResult[idx].filename});
                playSong(newId);
                document.getElementById('ytResults').innerHTML = '';
                document.getElementById('ytInput').value = '';
                pushMsg('ANDRZEJ', `Now playing: "${title}" [YouTube] ▶`, 'bot');
                toast(`Playing "${title}"`, 'success');
            } catch (err) {
                pushMsg('SYSTEM', `Download failed: ${err.message}`, 'system');
            }
        }

        async function ytQueue(idx, title, duration) {
            const newId = 'yt_' + Date.now() + '_' + idx;

            try {
                const res = await apiFetch(`/api/downloadYT?query=${encodeURIComponent(ytsearchResult[idx].filename)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                songs.push({id: newId, title, server: 'youtube', played_counter: 0, filename: ytsearchResult[idx].filename});
                const res2 = await fetch(`${API}/api/queue/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        SongId: ytsearchResult[idx].filename,
                        SongName: ytsearchResult[idx].title
                    })
                });
                if (!res2.ok) throw new Error(`HTTP ${res2.status}`);
                queue.push(newId);
                renderQueue();
                pushMsg('ANDRZEJ', `Added to queue: "${title}" [YouTube]`, 'bot');
                toast(`Queued "${title}"`, 'success');
            } catch (err) {
                pushMsg('SYSTEM', `Download failed: ${err.message}`, 'system');
            }
        }

        // ─── INIT ───
        checkAuth();
    </script>
